<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO — title, description & canonical are set per-page by react-helmet-async
         (see src/pages/*.jsx). Do not add them here: a static tag here plus a Helmet-managed
         one on the same page produces duplicate <title>/<meta> tags, since Helmet only manages
         tags it renders itself and never removes ones already present in the source HTML. -->
    <meta name="keywords" content="landing page expert, CRO specialist, conversion rate optimization, sales funnel builder, Webflow expert, ClickFunnels expert, GoHighLevel landing page, lead generation, high converting landing page, Rahim Badsha, ConversionLiftLab, AI lead automation, CRM automation" />
    <meta name="author" content="Rahim Badsha — ConversionLiftLab" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://conversionliftlab.com/" />
    <meta property="og:title" content="ConversionLiftLab | CRO Landing Pages That Actually Convert" />
    <meta property="og:description" content="Top Rated on Upwork · 100% Job Success · 1050+ pages · $200K+ earned. Landing pages and funnels built for measurable ROI, with AI-powered lead automation." />
    <meta property="og:image" content="https://conversionliftlab.com/images/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ConversionLiftLab" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://conversionliftlab.com/" />
    <meta name="twitter:title" content="ConversionLiftLab | CRO Landing Pages That Actually Convert" />
    <meta name="twitter:description" content="Top Rated on Upwork · 100% JSS · 1050+ pages built. CRO landing pages, funnels & AI lead automation." />
    <meta name="twitter:image" content="https://conversionliftlab.com/images/og-cover.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://conversionliftlab.com/#person",
          "name": "Rahim Badsha",
          "alternateName": "Md Rahim Badsha",
          "jobTitle": "CRO Specialist & Landing Page Expert",
          "description": "Top Rated Upwork freelancer with 100% Job Success Score. 10+ years building high-converting landing pages, sales funnels, and AI-powered lead automation systems. 1050+ pages delivered, $200K+ earned.",
          "url": "https://conversionliftlab.com",
          "email": "contact@conversionliftlab.com",
          "image": "https://conversionliftlab.com/images/rahim.png",
          "sameAs": [
            "https://www.upwork.com/freelancers/rahimbadsha",
            "https://www.fiverr.com/s/8zk7Wpv",
            "https://www.linkedin.com/in/abdrahimbd/"
          ],
          "knowsAbout": ["CRO", "Landing Page Design", "Sales Funnels", "Webflow", "ClickFunnels", "GoHighLevel", "AI Automation", "Lead Generation", "Conversion Rate Optimization"],
          "worksFor": { "@id": "https://conversionliftlab.com/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://conversionliftlab.com/#organization",
          "name": "ConversionLiftLab",
          "url": "https://conversionliftlab.com",
          "logo": "https://conversionliftlab.com/images/og-cover.png",
          "email": "contact@conversionliftlab.com",
          "founder": { "@id": "https://conversionliftlab.com/#person" },
          "description": "CRO agency specializing in high-converting landing pages, sales funnels, and AI-powered lead automation. Top Rated on Upwork with 100% Job Success Score.",
          "slogan": "Landing Pages That Actually Convert",
          "serviceArea": { "@type": "GeoShape", "name": "Worldwide" },
          "areaServed": "Worldwide",
          "priceRange": "$997–$4997",
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "CRO Services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Landing Page Design", "description": "High-converting landing pages built from scratch" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Funnel Building", "description": "End-to-end sales funnels with A/B testing" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "CRO Optimization", "description": "Data-driven conversion rate optimization" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Lead & CRM Automation", "description": "AI-powered lead qualification and CRM automation" } }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://conversionliftlab.com/#website",
          "url": "https://conversionliftlab.com",
          "name": "ConversionLiftLab",
          "publisher": { "@id": "https://conversionliftlab.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://conversionliftlab.com/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What platforms do you work with?",
              "acceptedAnswer": { "@type": "Answer", "text": "Webflow, ClickFunnels (1 & 2), GoHighLevel, HubSpot, Unbounce, Instapage, WordPress (Elementor/Divi), Shopify, Systeme.io, Funnelish, and Gem Pages. If your platform isn't listed, ask — I've probably worked with it." }
            },
            {
              "@type": "Question",
              "name": "How long does a landing page take?",
              "acceptedAnswer": { "@type": "Answer", "text": "Simple landing pages: 3-5 days. Full funnels (3-7 pages): 7-14 days. Timelines are committed to, not estimated." }
            },
            {
              "@type": "Question",
              "name": "Do you write copy or just design?",
              "acceptedAnswer": { "@type": "Answer", "text": "Both. I handle research, copy, design, and build end-to-end. You can provide your own copy if you prefer — but conversion-focused copy from me is included in every project." }
            },
            {
              "@type": "Question",
              "name": "What's your revision policy?",
              "acceptedAnswer": { "@type": "Answer", "text": "Starter: 2 rounds. Pro Funnel & Retainer: unlimited. I work until you're happy — not until my hours run out." }
            },
            {
              "@type": "Question",
              "name": "Do you offer post-launch optimization?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes — retainer plan includes ongoing A/B testing, heatmap analysis, and monthly CRO reports. For one-time projects, 30-day post-launch support is included." }
            },
            {
              "@type": "Question",
              "name": "How do I get started?",
              "acceptedAnswer": { "@type": "Answer", "text": "Fill in the contact form, send a message on Upwork or Fiverr, or book a free 30-min audit call. I respond within 2 hours." }
            }
          ]
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Runs before paint so dark mode (the default) applies immediately — no flash of light.
      (function () {
        var t = 'dark';
        try { t = localStorage.getItem('cll-theme') || 'dark'; } catch (e) {}
        if (t === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
